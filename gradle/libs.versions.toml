# Versjonene som sykepenger-pluginene påtvinger modulene sine samles her, slik at Dependabot kan holde dem
# oppdatert. Dependabot leser kun build.gradle.kts, settings.gradle.kts og gradle/libs.versions.toml –
# den ser ikke inn i precompiled script plugins under src/main/kotlin. Derfor genereres
# `no.nav.sykepenger.gradleplugins.SykepengerVersions` fra denne katalogen (se build.gradle.kts), og pluginene refererer til
# konstantene der. Versjonene som brukes til å bygge selve pluginene står i build.gradle.kts, der
# Dependabot allerede oppdaterer dem.

[versions]
bouncycastle = "1.86"
jetty = "12.1.13"
logback = "1.6.5"

[libraries]
# BOM-er som eksponeres til moduler via no.nav.sykepenger.kotlin
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version = "2.22.3" }
jackson3-bom = { module = "tools.jackson:jackson-bom", version = "3.2.3" }
jetty-bom = { module = "org.eclipse.jetty:jetty-bom", version.ref = "jetty" }
jetty-ee10-bom = { module = "org.eclipse.jetty.ee10:jetty-ee10-bom", version.ref = "jetty" }
junit-bom = { module = "org.junit:junit-bom", version = "6.1.3" }
ktor-bom = { module = "io.ktor:ktor-bom", version = "3.6.0" }
micrometer-bom = { module = "io.micrometer:micrometer-bom", version = "1.17.1" }
netty-bom = { module = "io.netty:netty-bom", version = "4.2.18.Final" }
prometheus-metrics-bom = { module = "io.prometheus:prometheus-metrics-bom", version = "1.9.0" }

# Dependency constraints
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
handlebars = { module = "com.github.jknack:handlebars", version = "4.5.5" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version = "4.3.1" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version = "1.12.0" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version = "1.66.0" }
